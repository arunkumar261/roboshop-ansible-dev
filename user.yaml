- name: User
  hosts: user 
  become: yes
  tasks:
  - name: Disabling and enabling nodejs version
    ansible.builtin.shell: |
      dnf module disable nodejs -y
      dnf module enable nodejs:18 -y

  - name: Installing nodejs 
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: Checking roboshop user exists or not
    ansible.builtin.command: id roboshop
    register: user

  - name: Creating user
    ansible.builtin.user:
      name: roboshop
    when: user.rc != 0
  
  - name: Recursively remove app directory
    ansible.builtin.file:
      path: /usr/share/nginx/html/
      state: absent

  - name: Creating html directory
    ansible.builtin.file:
      path: /usr/share/nginx/html/
      state: present

  - name: Downloading user application
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/user.zip
      dest: /tmp/
  
  - name: Unzipping user application
    ansible.builtin.unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes
  
  - name: NPM dependencies
    ansible.builtin.command: npm install
    args:
      chdir: /app

  - name: Copying user service file 
    ansible.builtin.copy:
      src: user.service
      dest: /etc/systemd/system/user.service
  
  - name: Deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: Start and enable user
    ansible.builtin.service:
      name: user
      state: present
      enabled: yes
  
  - name: Copying mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: installing mongodb client
    ansible.builtin.package:
      name: mongodb-org-shell
      state: present
  
  - name: Checking user data 
    ansible.builtin.command: mongo --host mongodb.arundev.store --quiet --eval 'db=db.getSiblingDB("users"); db.users.count()'
    register: user_count

  - name: Printing the user count
    ansible.builtin.debug:
      msg: "Users count is : {{user_count}}"
  
  - name: Loading user data
    ansible.builtin.command: mongo --host mongodb.arundev.store < /app/schema/user.js
    when: user_count.stdout == "0"
  
  - name: start and enable user
    ansible.builtin.service:
      name: user
      state: restarted
      enabled: yes