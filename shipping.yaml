- name: Shipping
  hosts: shipping 
  become: yes
  tasks: 
  - name: Installing Maven 
    ansible.builtin.package:
      name: maven 
      state: present
  
  - name: Checking user exists or not
    ansible.builtin.command: id roboshop
    register: output
    failed_when: false

  - name: Creating roboshop user
    ansible.builtin.user:
      name: roboshop
    when: output.rc != 0

  - name: Recursively remove app directory
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: creating app directory
    ansible.builtin.file:
      path: /app
      state: present

  - name: Downloading Shipping application
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/shipping.zip
      dest: /tmp/shipping.zip

  - name: Unzipping the application
    ansible.builtin.unarchive:
      path: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: maven clean package
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: renaming the jar file
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
    args:
      chdir: /app

  - name: Copying shipping.service
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service

  - name: Deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: start and enable
    ansible.builtin.service:
      name: shipping
      state: started
      enabled: yes
  
  - name: install mysql
    ansible.builtin.package:
      name: mysql 
      state: present
  
  - name: check cities schema exists or not
    ansible.builtin.command:  mysql -h mysql.arundev.store -uroot -p{{mysql_password}} -sN -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME = 'cities'"
    register: schema

  - name: print output
    ansible.builtin.debug:
      msg: "schema output: {{schema}}"

  - name: load cities data
    ansible.builtin.shell: "mysql -h mysql.arundev.store -uroot -p{{mysql_password}}  < /app/schema/shipping.sql"
    when: schema.stdout != "1"

  - name: start and enable shipping
    ansible.builtin.service:
      name: shipping
      state: restarted
      enabled: yes