- name: Catalogue
  hosts: catalogue
  become: yes
  tasks:
  - name: Disabling old nodejs package
    ansible.builtin.shell: |
      dnf module disable nodejs -y
      dnf module enable nodejs:18 -y
  
  - name: Installing nodejs:18 package
    ansible.builtin.package:
      name: nodejs
      state: present

  - name: creating user
    ansible.builtin.user:
      name: roboshop

  - name: Recursively remove app directory if exists
    ansible.builtin.file:
      path: /app
      state: absent

  - name: creating app directory 
    ansible.builtin.file:
      path: /app
      state: directory

  - name: Download Catalogue application
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/catalogue.zip
      dest: /tmp

  - name: Unzipping a catalogue application
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  
  - name: Install npm dependencies
    ansible.builtin.command: npm install
    args:
      chdir: /app

  - name: Copying the catalogue service file
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service
  
  - name: deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Copying mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: Install mongodb client
    ansible.builtin.package:
      name: mongodb-org-shell
      state: present

  - name: get the categories count
    ansible.builtin.command: mongo --host mongodb.arundev.store --quiet --eval 'db = db.getSiblingDB("catalogue"); db.products.count()'
    register: product_count

  - name: loading catalogue data 
    ansible.builtin.command: mongo --host mongodb.arundev.store  < /app/schema/catalogue.js
    when: product_count.stdout == "0"

  - name: Start and enable catalogue
    ansible.builtin.service:
      name: catalogue
      state: restarted
      enabled: yes
  





